[project]
name = "helpdeskapi"
version = "0.1.0"
description = "An API for a small business to manage support tickets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fastapi-pagination>=0.16.0",
    "psycopg[binary]>=3.3.5",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]
